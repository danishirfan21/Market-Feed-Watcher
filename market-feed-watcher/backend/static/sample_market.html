<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Auto Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
    }

    /* THE CRAWLER TARGET: .listing */
    .listing {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .listing:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    }

    .car-image {
      height: 200px;
      background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
      position: relative;
    }
    
    .car-image::after {
      content: '🚘';
      font-size: 48px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.5;
    }

    .details {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    /* THE CRAWLER TARGET: h2 */
    .listing h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
      line-height: 1.3;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }

    /* THE CRAWLER TARGET: .price */
    .price-container {
      display: flex;
      align-items: center;
    }
    .price-prefix {
      font-size: 14px;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .price {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    /* THE CRAWLER TARGET: .status */
    .status {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status[data-value="available"] {
      background: #dcfce7;
      color: #166534;
    }
    
    .status[data-value="sold"] {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Premium Auto Market</h1>
      <p>Discover our latest certified vehicles.</p>
    </div>

    <div class="grid">
      <!-- The parser looks for .listing, h2, .price, .status -->
      <div class="listing" data-id="local-001">
        <div class="car-image"></div>
        <div class="details">
          <h2>2020 Kia Sportage</h2>
          <div class="meta-row">
            <div class="price-container">
              <span class="price-prefix">Rs.</span>
              <span class="price">8500000</span>
            </div>
            <span class="status" data-value="available">available</span>
          </div>
        </div>
      </div>

      <div class="listing" data-id="local-002">
        <div class="car-image" style="background: linear-gradient(135deg, #cbd5e1, #94a3b8);"></div>
        <div class="details">
          <h2>2022 MG HS</h2>
          <div class="meta-row">
            <div class="price-container">
              <span class="price-prefix">Rs.</span>
              <span class="price">9200000</span>
            </div>
            <span class="status" data-value="available">available</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
