<!DOCTYPE html>
<html>
  <head>
    <title>Market Feed WebSocket Test</title>
  </head>
  <body>
    <h1>Market Feed Live Changes</h1>
    <button onclick="clearEvents()">Clear</button>
    <ul id="events"></ul>

    <script>
      const events = document.getElementById("events");
      const socket = new WebSocket("ws://localhost:8000/ws/changes");

      socket.onopen = () => {
        addEvent("Connected to live market feed");
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        addEvent(JSON.stringify(data, null, 2));
      };

      socket.onclose = () => {
        addEvent("Disconnected from live market feed");
      };

      function addEvent(message) {
        const item = document.createElement("li");
        item.innerText = message;
        events.prepend(item);
      }

      function clearEvents() {
        events.innerHTML = "";
      }
    </script>
  </body>
</html>
